services:
  cryptopegion:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - pgdata:/app/data
    environment:
      - PORT=8000
      - DB_PATH=/app/data/cryptopegion.db
      - DEMO_MODE=1
      - ENABLE_ADS=1
      - ADMIN_EMAIL=admin@cryptopegion.local
      - ADMIN_PASSWORD=change-me-in-production
    restart: unless-stopped

volumes:
  pgdata:
